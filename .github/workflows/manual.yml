name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Swift Package
        run: |
          # Wchodzimy do folderu App, gdzie znajduje się Package.swift
          cd App
          
          # Budujemy pakiet dla architektury iPhone'a
          swift build -c release --triple arm64-apple-ios
          
          # Tworzymy strukturę pliku .ipa w katalogu głównym
          mkdir -p ../build/Payload
          
          # Kopiujemy zbudowaną aplikację, jeśli kompilator wygenerował plik .app
          find .build -name "*.app" -exec cp -r {} ../build/Payload/ \; 2>/dev/null || true
          
          # Jeśli pliku .app nie ma, pakujemy bezpośrednio pliki wykonywalne z katalogu release
          if [ -z "$(ls -A ../build/Payload)" ]; then
            mkdir -p ../build/Payload/App.app
            find .build/release -type f -maxdepth 1 -exec cp {} ../build/Payload/App.app/ \;
          fi
          
          cd ../build
          zip -r App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Package
          path: build/App.ipa
