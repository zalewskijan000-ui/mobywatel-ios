name: Build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Swift Package
        run: |
          swift build -c release --triple arm64-apple-ios
          
          # Tworzenie struktury pliku .ipa
          mkdir -p build/Payload
          
          # Kopiowanie zbudowanej aplikacji (szukamy pliku .app w katalogu .build)
          find .build -name "*.app" -exec cp -r {} build/Payload/ \; 2>/dev/null || true
          
          # Jeśli autor nie tworzy bezpośrednio .app, spakujemy to co wypluł kompilator
          if [ -z "$(ls -A build/Payload)" ]; then
            mkdir -p build/Payload/App.app
            find .build/release -type f -maxdepth 1 -exec cp {} build/Payload/App.app/ \;
          fi
          
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: App-Package
          path: build/App.ipa
